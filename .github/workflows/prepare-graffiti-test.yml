name: Prepare graffiti test captures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-graffiti-test.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the open-source SOG converter
        run: |
          python -m pip install numpy
          npm install --global @playcanvas/splat-transform@3.12.0
      - name: Convert the original Artillery Passage streamed SOG
        run: |
          git clone --depth 1 https://github.com/willeastcott/splat-walk.git /tmp/artillery-source
          cd /tmp/artillery-source/public/scene
          splat-transform lod-meta.json -H 0 /tmp/f4897475-full.ply
          cd "$GITHUB_WORKSPACE"
          mkdir -p prepared
          python static-12-test/prepare-preview.py /tmp/f4897475-full.ply prepared/f4897475.ply
          rm -f /tmp/f4897475-full.ply
          ls -lh prepared/f4897475.ply
          test -s prepared/f4897475.ply
          test "$(stat -c%s prepared/f4897475.ply)" -lt 20000000
      - uses: actions/upload-artifact@v4
        with:
          name: graffiti-preview-assets
          path: prepared/f4897475.ply
          retention-days: 1
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: graffiti-preview-assets
          path: prepared
      - name: Commit prepared Artillery preview to test folder only
        run: |
          mkdir -p static-12-test/models
          cp prepared/f4897475.ply static-12-test/models/f4897475.ply
          git add static-12-test/models/f4897475.ply
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add converted Artillery Passage preview to test only"
          git push origin main
