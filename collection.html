<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030303);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.025,400),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxDistance=120;
const world=new THREE.Group();scene.add(world);if(matchMedia('(pointer: coarse)').matches)$('tier').value='mobile';

const vertexShader=`
uniform sampler2D depthTex,colorTex;
uniform int gridW,gridH,stride,cols,samples;
uniform vec4 intr;
uniform vec2 logRange;
uniform float qmax,cutoff,sizeScale,pixelScale,worldScale;
out vec3 vColor;flat out float valid;
struct S {vec3 p;vec3 c;float z;};
S readP(ivec2 xy){
 vec2 b=texelFetch(depthTex,xy,0).rg;float q=dot(floor(b*255.+.5),vec2(1.,256.));
 float z=exp(mix(logRange.x,logRange.y,q/qmax));
 return S(vec3((float(xy.x)-intr.z)/intr.x*z,-(float(xy.y)-intr.w)/intr.y*z,-z),texelFetch(colorTex,xy,0).rgb,z);
}
bool joined(S a,S b){return a.z<cutoff&&b.z<cutoff&&abs(a.z-b.z)<.035*min(a.z,b.z);}
S mid(S a,S b){return S(mix(a.p,b.p,.5),mix(a.c,b.c,.5),mix(a.z,b.z,.5));}
void main(){
 int id=gl_VertexID/samples,sub=gl_VertexID%samples;
 ivec2 xy=ivec2((id%cols)*stride,(id/cols)*stride);S p=readP(xy);valid=p.z<cutoff?1.:0.;
 if(sub==1){if(xy.x+stride>=gridW)valid=0.;else{S r=readP(xy+ivec2(stride,0));if(joined(p,r))p=mid(p,r);else valid=0.;}}
 if(sub==2){if(xy.y+stride>=gridH)valid=0.;else{S d=readP(xy+ivec2(0,stride));if(joined(p,d))p=mid(p,d);else valid=0.;}}
 if(sub==3){if(xy.x+stride>=gridW||xy.y+stride>=gridH)valid=0.;else{S r=readP(xy+ivec2(stride,0)),d=readP(xy+ivec2(0,stride)),q=readP(xy+ivec2(stride,stride));if(joined(p,r)&&joined(p,d)&&joined(r,q)&&joined(d,q))p=mid(mid(p,r),mid(d,q));else valid=0.;}}
 vec4 mv=modelViewMatrix*vec4(p.p,1.);gl_Position=valid>.5?projectionMatrix*mv:vec4(2.,2.,2.,1.);
 gl_PointSize=clamp(p.z/intr.x*pixelScale*worldScale/max(.01,-mv.z)*sizeScale*float(stride)*(samples==4?1.05:1.65),1.,10.);vColor=p.c;
}`;
const fragmentShader=`in vec3 vColor;flat in float valid;out vec4 outColor;void main(){if(valid<.5)discard;vec2 q=(gl_PointCoord-.5)*2.;float r=dot(q,q);if(r>1.)discard;outColor=vec4(vColor,1.-smoothstep(.58,1.,r));}`;

const workerSource="function unpack(raw,w,h,count,qmax){\n const dv=new DataView(raw),u8=new Uint8Array(raw);\n if(raw.byteLength<8||u8[0]!==76||u8[1]!==65||u8[2]!==76||u8[3]!==49||dv.getUint32(4,true)!==count)throw Error('Invalid LAL1 chunk');\n const frames=[];let pos=8,prev=null,n=w*h;\n for(let i=0;i<count;i++){\n  if(pos+4+2*n>raw.byteLength)throw Error('Truncated depth');\n  const len=dv.getUint32(pos,true);pos+=4;if(len<1||pos+2*n+len>raw.byteLength)throw Error('Truncated colour');\n  const q=new Uint16Array(n);\n  for(let y=0;y<h;y++){let sum=0;for(let x=0;x<w;x++){const j=y*w+x;sum=(sum+dv.getUint16(pos+2*j,true))&65535;q[j]=(sum+(prev?prev[j]:0))&65535;if(q[j]>qmax)throw Error('Invalid depth sample');}}\n  pos+=2*n;frames.push({q,jpg:u8.slice(pos,pos+len)});pos+=len;prev=q;\n }\n if(pos!==raw.byteLength)throw Error('Trailing chunk bytes');return frames;\n}\nonmessage=async e=>{const {id,file,w,h,count,qmax}=e.data;try{\n const raw=await new Response(file.stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();\n const frames=unpack(raw,w,h,count,qmax);postMessage({id,frames},frames.flatMap(f=>[f.q.buffer,f.jpg.buffer]));\n }catch(err){postMessage({id,error:String(err.message||err)});}};\n";
let worker,jobId=0,jobs=new Map(),generation=0,states=[],selectedFiles=[],playing=true,orbit=false,loading=false,last=0,report=0,ticks=0,fps=60,cursor=0,chunkActive=0,bitmapActive=0,frameBudget=1800000;
const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
function newWorker(){

 worker.onmessage=e=>{const j=jobs.get(e.data.id);if(!j)return;jobs.delete(e.data.id);if(e.data.error)j.reject(Error(e.data.error));else j.resolve(e.data.frames);};

}
function decodeChunk(file,m,c){return new Promise((resolve,reject)=>{const id=++jobId;jobs.set(id,{resolve,reject});worker.postMessage({id,file,w:m.width,h:m.height,count:c.count,qmax:m.depth_encoding.quantization_max});});}
function fail(s,e){if(s.gen!==generation)return;s.error=String(e.message||e);s.enabled=false;if(s.root)s.root.visible=false;updateList();layout(false);}
function texture(data,w,h,format){const t=new THREE.DataTexture(data,w,h,format,THREE.UnsignedByteType);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.unpackAlignment=1;t.needsUpdate=true;return t;}
function toBytes(q){return new Uint8Array(q.buffer,q.byteOffset,q.byteLength);}
function visible(){return states.filter(s=>s.enabled&&!s.error);}
function getCutoff(s){return Math.max(Number($('depth').value),s.minDepth*1.1);}
function estimateBounds(s,q){
 const m=s.m,{fx,fy,cx,cy}=m.intrinsics,d=m.depth_encoding,lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];let min=Infinity;for(let y=0;y<m.height;y+=4)for(let x=0;x<m.width;x+=4){const z=Math.exp(d.log_min+q[y*m.width+x]/d.quantization_max*(d.log_max-d.log_min));min=Math.min(min,z);}
 s.minDepth=min;const cut=getCutoff(s);
 for(let y=0;y<m.height;y+=4)for(let x=0;x<m.width;x+=4){const z=Math.exp(d.log_min+q[y*m.width+x]/d.quantization_max*(d.log_max-d.log_min));if(z>cut)continue;const p=[(x-cx)/fx*z,-(y-cy)/fy*z,-z];for(let a=0;a<3;a++){lo[a]=Math.min(lo[a],p[a]);hi[a]=Math.max(hi[a],p[a]);}}

}
function mount(s,q,rgb){
 const m=s.m,n=m.width*m.height,k=m.intrinsics,d=m.depth_encoding,b=estimateBounds(s,q),scale=2.2/b.span;
 s.root=new THREE.Group();world.add(s.root);s.geo=new THREE.BufferGeometry();
 // Shared dummy geometry per dimensions; positions are calculated in the vertex shader.
 s.geo.setAttribute('position',geometryFor(n));
 s.d=texture(toBytes(q),m.width,m.height,THREE.RGFormat);s.c=texture(rgb,m.width,m.height,THREE.RGBAFormat);
 s.mat=new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader,fragmentShader,uniforms:{depthTex:{value:s.d},colorTex:{value:s.c},gridW:{value:m.width},gridH:{value:m.height},cols:{value:m.width},stride:{value:1},samples:{value:1},intr:{value:new THREE.Vector4(k.fx,k.fy,k.cx,k.cy)},logRange:{value:new THREE.Vector2(d.log_min,d.log_max)},qmax:{value:d.quantization_max},cutoff:{value:getCutoff(s)},sizeScale:{value:Number($('size').value)},pixelScale:{value:pixelScale()},worldScale:{value:scale}},transparent:false,depthWrite:true,depthTest:true,alphaToCoverage:true});
 s.cloud=new THREE.Points(s.geo,s.mat);s.cloud.frustumCulled=false;s.cloud.scale.setScalar(scale);s.cloud.position.set(...b.center.map(x=>-x*scale));s.root.add(s.cloud);s.root.visible=s.enabled;applyDetail();layout(false);
}
const geometryCache=new Map();
function geometryFor(n){if(!geometryCache.has(n))geometryCache.set(n,new THREE.BufferAttribute(new Float32Array(n*4*3),3));return geometryCache.get(n);}
function pixelScale(){return renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));}
function applyDetail(){
 const a=visible(),total=a.reduce((v,s)=>v+s.m.width*s.m.height,0),mode=$('detail').value;
 const stride=mode==='auto'?Math.max(1,Math.ceil(Math.sqrt(total/frameBudget))):1,samples=mode==='fine'?4:1;
 for(const s of states){if(!s.mat)continue;const w=s.m.width,h=s.m.height,cols=Math.ceil(w/stride),rows=Math.ceil(h/stride),u=s.mat.uniforms;u.stride.value=stride;u.cols.value=cols;u.samples.value=samples;s.geo.setDrawRange(0,cols*rows*samples);}
}
function layout(resetCam=true){
 const a=visible(),n=a.length,mode=$('layout').value,columns=Math.ceil(Math.sqrt(n||1)*1.25),rows=Math.ceil(n/columns),radius=Math.max(2.5,n*2.9/(2*Math.PI));
 for(let i=0;i<n;i++){const s=a[i];if(!s.root)continue;let x=0,y=0,z=0,rx=0,ry=0,rz=0;
  if(n>1&&mode==='ring'){const t=2*Math.PI*i/n;x=Math.sin(t)*radius;z=Math.cos(t)*radius;ry=t;y=Math.sin(i*1.8)*.4;}
  else if(n>1){x=(i%columns-(columns-1)/2)*2.8;y=((rows-1)/2-Math.floor(i/columns))*2.35;if(mode==='space'){z=Math.sin(i*2.4)*.65;ry=Math.sin(i*1.8)*.24;rx=Math.sin(i*2.1)*.10;rz=Math.cos(i*2.2)*.10;}}
  s.root.position.set(x,y,z);s.root.rotation.set(rx,ry,rz);s.baseYaw=ry;s.root.visible=true;
 }
 for(const s of states)if(s.root&&!a.includes(s))s.root.visible=false;
 if(resetCam){world.rotation.y=0;controls.target.set(0,0,0);const vf=THREE.MathUtils.degToRad(camera.fov/2),fit=n<=1?2.7:mode==='ring'?radius+1.8:Math.max(rows*1.2,columns*1.4/camera.aspect)+.8;camera.position.set(0,mode==='ring'&&n>1?radius*.7:.15,fit/Math.tan(vf)+1);controls.update();}
}
function updateList(){
 const list=$('list');list.replaceChildren();for(const s of states){const row=document.createElement('div');row.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=s.enabled;cb.disabled=!!s.error;cb.onchange=()=>{s.enabled=cb.checked;if(!s.enabled){s.chunks.clear();}applyDetail();layout();};
 const b=document.createElement('button');b.textContent=s.name;b.title=s.name;b.disabled=!!s.error;b.onclick=()=>{for(const a of states){a.enabled=a===s;if(a!==s)a.chunks.clear();}updateList();applyDetail();layout();};
 const sm=document.createElement('small');sm.textContent=s.error?'error':s.m.width+'px';row.append(cb,b,sm);list.append(row);}
 $('errors').textContent=states.filter(s=>s.error).map(s=>s.name+': '+s.error).join('\n');
}
function validate(m,base,files){
 const d=m.depth_encoding,k=m.intrinsics;
 if(m.format!=='lal-web-depth-v1'||!Number.isInteger(m.width)||!Number.isInteger(m.height)||m.width<2||m.height<2||m.width*m.height>1200000||!Number.isInteger(m.num_frames)||m.num_frames<1||m.num_frames>30000||!(m.fps>0&&m.fps<=120)||!k||!(k.fx>0&&k.fy>0)||!d||!Number.isInteger(d.quantization_max)||d.quantization_max<1||d.quantization_max>65535||![d.log_min,d.log_max,k.cx,k.cy].every(Number.isFinite)||!(d.log_max>d.log_min)||!Array.isArray(m.chunks))throw Error('Unsupported sequence manifest');
 let at=0;const index=new Int32Array(m.num_frames);
 m.chunks.forEach((c,i)=>{if(c.start!==at||!Number.isInteger(c.count)||c.count<1||c.count>120||at+c.count>m.num_frames||!/^\d+\.lal$/.test(c.file)||files.get(base+c.file)?.size!==c.bytes)throw Error('Missing or invalid chunk '+c.file);index.fill(i,at,at+c.count);at+=c.count;});
 if(at!==m.num_frames)throw Error('Incomplete sequence');return index;
}
function clear(){generation++;for(const s of states){if(s.root)world.remove(s.root);if(s.geo){s.geo.dispose();}s.mat?.dispose();s.d?.dispose();s.c?.dispose();s.chunks.clear();}states=[];geometryCache.clear();newWorker();loading=false;world.rotation.y=0;last=0;}
async function open(filesIn){
 clear();const gen=generation;loading=true;$('intro').hidden=false;$('message').textContent='Scanning the folder…';$('errors').textContent='';
 const files=new Map(Array.from(filesIn,f=>[f.webkitRelativePath||f.name,f])),tier=$('tier').value,keys=[...files.keys()];
 const grouped=new Map();for(const p of keys){if(p.includes('.partial/')||!p.endsWith('/sequence.json'))continue;const seg=p.split('/'),kind=seg[seg.length-2];if(kind!=='desktop'&&kind!=='mobile')continue;const id=seg.slice(0,-2).join('/');if(!grouped.has(id))grouped.set(id,{});grouped.get(id)[kind]=p;}
 const paths=[...grouped.values()].map(t=>t[tier]||t[tier==='desktop'?'mobile':'desktop']).filter(Boolean);
 if(!paths.length){$('message').textContent='No mobile/desktop sequence folders found. Extract the optimiser ZIP and select web_assets_v2.';loading=false;return;}
 let issues=[];
 for(const path of paths.sort()){try{const m=JSON.parse(await files.get(path).text()),base=path.slice(0,path.lastIndexOf('/')+1),index=validate(m,base,files);
 if(gen!==generation)return;
 states.push({gen,m,base,index,files,name:m.source||path.split('/').slice(-3,-2)[0],enabled:true,error:null,chunks:new Map(),pending:new Set(),bitmap:false,shown:-1,clock:0,minDepth:.01});
 }catch(e){issues.push(path+': '+e.message);}}
 if(gen!==generation)return;loading=false;updateList();if(issues.length)$('errors').textContent+=('\n'+issues.join('\n'));if(!states.length){$('message').textContent='No complete sequences: '+issues.slice(0,2).join('; ');return;}
 layout();$('intro').hidden=true;$('panel').hidden=false;last=0;
}
function requestChunk(s,k){
 if(s.chunks.has(k)||s.pending.has(k)||chunkActive>=2)return;
 const c=s.m.chunks[k];s.pending.add(k);chunkActive++;
 decodeChunk(s.files.get(s.base+c.file),s.m,c).then(frames=>{if(s.gen===generation&&s.enabled){s.chunks.set(k,frames);while(s.chunks.size>2){const keep=s.index[Math.floor(s.clock)%s.m.num_frames];const victim=[...s.chunks.keys()].find(x=>x!==keep&&x!==k);s.chunks.delete(victim??s.chunks.keys().next().value);}}}).catch(e=>fail(s,e)).finally(()=>{s.pending.delete(k);chunkActive--;});
}
function requestFrame(s,i){
 if(s.bitmap||bitmapActive>=4||s.shown===i)return;
 const k=s.index[i],c=s.m.chunks[k],f=s.chunks.get(k)?.[i-c.start];if(!f){requestChunk(s,k);return;}
 s.bitmap=true;bitmapActive++;
 (async()=>{let bmp;try{bmp=await createImageBitmap(new Blob([f.jpg],{type:'image/jpeg'}));if(s.gen!==generation||!s.enabled)return;
 const m=s.m;if(bmp.width!==m.width||bmp.height!==m.height)throw Error('Wrong colour dimensions');
 if(cv.width!==m.width||cv.height!==m.height){cv.width=m.width;cv.height=m.height;}ctx.drawImage(bmp,0,0);const rgb=new Uint8Array(ctx.getImageData(0,0,m.width,m.height).data.buffer);

 }catch(e){fail(s,e);}finally{bmp?.close();s.bitmap=false;bitmapActive--;}})();
}
function toggleAll(on){for(const s of states){s.enabled=on&&!s.error;if(!on)s.chunks.clear();}updateList();applyDetail();layout();}
$('file').onchange=e=>{selectedFiles=Array.from(e.target.files);if(selectedFiles.length)open(selectedFiles);};
$('tier').onchange=()=>{if(selectedFiles.length)open(selectedFiles);};
$('showlist').onclick=()=>$('panel').hidden=!$('panel').hidden;
$('all').onclick=()=>toggleAll(true);$('none').onclick=()=>toggleAll(false);
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';last=0;};
$('orbit').onclick=()=>{orbit=!orbit;$('orbit').textContent=orbit?'Orbit on':'Orbit off';};
$('layout').onchange=()=>layout();$('reset').onclick=()=>layout();$('detail').onchange=applyDetail;
$('size').oninput=()=>{for(const s of states)if(s.mat)s.mat.uniforms.sizeScale.value=Number($('size').value);};
$('depth').oninput=()=>{for(const s of states)if(s.mat)s.mat.uniforms.cutoff.value=getCutoff(s);};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);for(const s of states)if(s.mat)s.mat.uniforms.pixelScale.value=pixelScale();});
document.addEventListener('visibilitychange',()=>last=0);
function animate(now){requestAnimationFrame(animate);if(document.hidden)return;const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 const a=visible(),n=a.length,rate=$('rate').value;let stalled=0;
 if(n){for(let j=0;j<n;j++){const s=a[(cursor+j)%n],m=s.m,cap=rate==='source'?m.fps:rate==='auto'?Math.min(m.fps,n>8?12:n>4?18:m.fps):Math.min(m.fps,Number(rate));
  if(playing&&s.shown>=0){const next=(s.clock+dt*m.fps)%m.num_frames;if(s.chunks.has(s.index[Math.floor(next)]))s.clock=next;else stalled++;}
  const step=m.fps/cap,i=Math.min(m.num_frames-1,Math.floor(Math.floor(s.clock/step)*step)),k=s.index[i];
  requestFrame(s,i);
