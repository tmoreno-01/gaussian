min(dx,dist(j,j+1));if(j>=width)dy=dist(j,j-width);if(j+width<n)dy=Math.min(dy,dist(j,j+width));const lo=Math.min(dx,dy),hi=Math.max(dx,dy);p[j*4+3]=Math.max(span*.0003,Math.min(span*.008,Math.max(lo,Math.min(hi,lo*2.5))));}\n return f;\n}\nfunction packHalf(p){\n const u=new Uint32Array(p.buffer,p.byteOffset,p.length),out=new Uint16Array(p.length);\n for(let i=0;i<u.length;i++){\n  const x=u[i],sign=(x>>>16)&0x8000,exp=((x>>>23)&255)-127+15,m=x&0x7fffff;\n  if(exp<=0){if(exp< -10){out[i]=sign;continue;}const v=(m|0x800000) >>> (1-exp);out[i]=sign|((v+0x1000)>>>13);}\n  else if(exp>=31)out[i]=sign|0x7bff;\n  else out[i]=sign|((exp<<10)+((m+0x1000)>>>13));\n }\n return out;\n}\nfunction emit(f,a,b){\n // Filter only small local errors with matching colours; retain abrupt changes and actual motion.\n const p=f.p.slice(),c=f.c;\n for(let k=0;k<p.length;k+=4){const x=p[k],y=p[k+1],z=p[k+2],r=p[k+3];let sx=x,sy=y,sz=z,total=1;\n  for(let pass=0;pass<2;pass++){const n=pass===0?a:b;if(!n||n.n!==f.n)continue;const dx=n.p[k]-x,dy=n.p[k+1]-y,dz=n.p[k+2]-z,dr=n.c[k]-c[k],dg=n.c[k+1]-c[k+1],db=n.c[k+2]-c[k+2];const limit=Math.min(f.bounds.span*.022,Math.max(f.bounds.span*.007,r*2.5));\n   if(dx*dx+dy*dy+dz*dz<limit*limit&&dr*dr+dg*dg+db*db<900){sx+=n.p[k]*.35;sy+=n.p[k+1]*.35;sz+=n.p[k+2]*.35;total+=.35;}}\n  p[k]=sx/total;p[k+1]=sy/total;p[k+2]=sz/total;\n  // Reject single-frame depth spikes only if both adjacent frames agree in geometry and colour.\n  if(a&&b){\n   const ax=a.p[k],ay=a.p[k+1],az=a.p[k+2],bx=b.p[k],by=b.p[k+1],bz=b.p[k+2];\n   const dx=ax-bx,dy=ay-by,dz=az-bz,span=f.bounds.span;\n   const colour=(q)=>{const r=q.c[k]-c[k],g=q.c[k+1]-c[k+1],b=q.c[k+2]-c[k+2];return r*r+g*g+b*b;};\n   const mx=(ax+bx)*.5,my=(ay+by)*.5,mz=(az+bz)*.5;\n   const ex=x-mx,ey=y-my,ez=z-mz;\n   if(dx*dx+dy*dy+dz*dz<(span*.018)**2&&colour(a)<650&&colour(b)<650&&ex*ex+ey*ey+ez*ez>(span*.035)**2){p[k]=mx;p[k+1]=my;p[k+2]=mz;}\n  }\n }\n const cc=c.slice(),half=packHalf(p);postMessage({type:'frame',index:f.index,n:f.n,width:f.width,bounds:f.bounds,p:half,c:cc},[half.buffer,cc.buffer]);\n}\nonmessage=async e=>{try{\n cutoff=e.data.cutoff;const zip=await JSZip.loadAsync(e.data.file),m=Object.keys(zip.files).find(n=>n.endsWith('sequence.json')),meta=m?JSON.parse(await zip.file(m).async('string')):{};\n const names=Object.keys(zip.files).filter(n=>/\\.ply$/i.test(n)&&!n.startsWith('__MACOSX/')).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));\n if(!names.length)throw Error('No PLY frames');\n const width=Number(meta.image_size)||512; if(!Number.isInteger(width)||width<2)throw Error('Invalid grid width');\n const sample=await zip.file(names[0]).async('arraybuffer'),first=decode(sample,width,0);\n if(first.n*20*names.length>700*1024*1024)throw Error('Sequence exceeds 700 MB decoded memory limit. Use a shorter test clip.');\n postMessage({type:'info',count:names.length,fps:Number(meta.fps)||30,n:first.n});\n const sampleCount=Math.min(21,names.length),samples=[first];\n for(let s=1;s<sampleCount;s++){\n  const i=Math.round(s*(names.length-1)/(sampleCount-1));\n  const frame=decode(await zip.file(names[i]).async('arraybuffer'),width,i);if(frame.n!==first.n)throw Error('Frame grid changed');samples.push(frame);\n  postMessage({type:'progress',message:'Analysing stationary background '+(s+1)+' / '+sampleCount+'…'});\n }\n postMessage({type:'progress',message:'Building stable background reference…'});\n const bg=sampleCount>=3?buildReference(samples):null;\n samples.length=0;\n let prev=null,cur=bg?stabilise(first,bg):first;\n for(let i=1;i<names.length;i++){let next=decode(await zip.file(names[i]).async('arraybuffer'),width,i);if(next.n!==first.n)throw Error('Frame grid changed');if(bg)next=stabilise(next,bg);emit(cur,prev,next);prev=cur;cur=next;}\n emit(cur,prev,null);postMessage({type:'done'});\n }catch(e){postMessage({type:'error',message:String(e)});}\n};";
const states=[{name:'Graffiti artist',cutoff:4.4,x:-1.22},{name:'Freight train',cutoff:3.2,x:1.22}];let ready=false,playing=true,orbit=true,clock=0,last=0,report=0,ticks=0,dragging=false,loading=false;

async function load(){if(loading||!states.every(s=>s.file))return;loading=true;ready=false;try{

 }catch(e){$('progress').textContent='Error: '+e.message+' — refresh to try again';}finally{loading=false;}}
for(const [i,id] of ['left','right'].entries())$(id).onchange=e=>{if(loading||ready)return;states[i].file=e.target.files[0];if(states[i].file){document.querySelector('label[for="'+id+'"]').textContent='✓ '+states[i].name;$('progress').textContent='Selected '+states[i].name;}load();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
$('orbit').onclick=()=>{orbit=!orbit;$('orbit').textContent=orbit?'Orbit on':'Orbit off';if(!orbit)for(const s of states)if(s.root)s.root.rotation.y=0;};
$('size').oninput=()=>{for(const s of states)if(s.material)s.material.uniforms.sizeScale.value=Number($('size').value);};
$('detail').onchange=()=>{const n=Number($('detail').value);for(const s of states)if(s.material){s.material.uniforms.samples.value=n;s.geometry.setDrawRange(0,s.info.n*n);}};

 if(ready){if(playing)clock+=dt;for(const s of states){const t=(clock*s.info.fps)%s.info.count,i=Math.floor(t),j=Math.min(i+1,s.info.count-1);frame(s,i,j,j===i?0:t-i);if(orbit&&!dragging)s.root.rotation.y=Math.sin(clock*.24)*.23;}ticks++;if(!report)report=now;if(now-report>1000){const fps=Math.round(ticks*1000/(now-report)),n=states.reduce((sum,s)=>sum+s.info.n,0);$('status').textContent=fps+' render fps · '+n.toLocaleString()+' source points · up to '+(n*Number($('detail').value)).toLocaleString()+' samples · fully loaded';report=now;ticks=0;}}
 controls.update();renderer.render(scene,camera);}
