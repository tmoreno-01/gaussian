<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="description" content="LifeAfterLogic — spatial graffiti study.">
<title>LifeAfterLogic — Spatial Graffiti Study 001</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030303}
body{font-family:Arial,Helvetica,sans-serif;color:#f2f1ec;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,#11120f 0%,#080908 40%,#030303 78%);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.76) 130%)}
.hud{position:absolute;z-index:5;top:clamp(18px,3vh,32px);left:clamp(18px,3.2vw,46px);right:clamp(18px,3.2vw,46px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:15px;font-weight:500;letter-spacing:-.045em}
.meta{margin-top:7px;color:rgba(242,241,236,.43);font-size:8px;letter-spacing:.2em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;color:rgba(242,241,236,.58);font-size:8px;letter-spacing:.18em;text-transform:uppercase}
.dot{width:5px;height:5px;border-radius:50%;background:#d7e47c;box-shadow:0 0 9px rgba(215,228,124,.65)}
.footer{position:absolute;z-index:5;left:clamp(18px,3.2vw,46px);right:clamp(18px,3.2vw,46px);bottom:clamp(18px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.hint{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,241,236,.54)}
.hint b{font-weight:500;color:rgba(242,241,236,.9)}
.credit{max-width:50%;font-size:8px;line-height:1.5;letter-spacing:.1em;text-align:right;text-transform:uppercase;color:rgba(242,241,236,.28)}
#loading{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(242,241,236,.48);font-size:8px;letter-spacing:.2em;text-transform:uppercase;transition:opacity .7s;pointer-events:none}
#loading.hidden{opacity:0}
#bar{width:130px;height:1px;background:rgba(255,255,255,.13);overflow:hidden}
#fill{height:100%;width:0;background:#d7e47c;transition:width .25s}
#error{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);max-width:360px;padding:16px;text-align:center;color:#c9c9c2;font-size:11px;line-height:1.6;display:none;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12)}
@media(max-width:700px){
 .hud{top:18px;left:17px;right:17px}
 .brand{font-size:14px}
 .meta,.status{font-size:7px}
 .footer{left:17px;right:17px;bottom:18px}
 .hint,.credit{font-size:7px}
 .credit{max-width:48%}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
    "@lumaai/luma-web": "https://unpkg.com/@lumaai/luma-web@0.2.0/dist/library/luma-web.module.js"
  }
}
</script>
</head>
<body>
<main id="stage" aria-label="Interactive orbit of real 3D Gaussian splat street-art captures. Drag to orbit and scroll to zoom.">
 <div id="loading"><span id="load-label">Loading Gaussian scenes</span><div id="bar"><div id="fill"></div></div></div>
 <div id="error"></div>
 <div id="veil"></div>
 <header class="hud">
  <div><div class="brand">lifeafterlogic</div><div class="meta">Spatial graffiti study / 001</div></div>
  <div class="status"><span class="dot"></span><span id="count">0 / 6 splats loaded</span></div>
 </header>
 <footer class="footer">
  <div class="hint"><b>Drag</b> to orbit&nbsp;&nbsp;·&nbsp;&nbsp;<b>Scroll</b> to zoom&nbsp;&nbsp;·&nbsp;&nbsp;<b>Right-drag</b> to pan</div>
  <div class="credit">Temporary static 3DGS captures by @Volt_Edge<br>Dynamic graffiti performances are the next stage</div>
 </footer>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { LumaSplatsThree } from "@lumaai/luma-web";

const stage = document.getElementById("stage");
const loading = document.getElementById("loading");
const fill = document.getElementById("fill");
const countLabel = document.getElementById("count");
const errorBox = document.getElementById("error");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.05, 120);
camera.position.set(2.55, 1.55, 9.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x030303, 1);
stage.insertBefore(renderer.domElement, stage.firstChild);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = true;
controls.minDistance = 5.2;
controls.maxDistance = 15.5;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI - 0.35;
controls.rotateSpeed = 0.48;
controls.zoomSpeed = 0.62;
controls.panSpeed = 0.45;

const orbit = new THREE.Group();
scene.add(orbit);

const captures = [
  { title: "Faraday Street / Bentoghoul", id: "3582f3b0-565e-443f-9165-3571c0721fbc", scale: 0.62, y: -0.14, tilt: -0.035 },
  { title: "Stevenson Place / July", id: "1a487b86-38a7-466d-856b-5d9ad2f84fab", scale: 0.64, y: 0.22, tilt: 0.045 },
  { title: "Faraday Street / June", id: "b101171b-cf5f-4669-ab44-d9fa39e69898", scale: 0.60, y: -0.28, tilt: 0.025 },
  { title: "Graffiti Palace / Lamp post", id: "9c6e8bac-3b79-4f39-a605-58999d33c33c", scale: 0.72, y: 0.30, tilt: -0.055 },
  { title: "Faraday Street / April", id: "94f2efd7-f65d-4b7f-b455-536e95643bad", scale: 0.60, y: -0.10, tilt: 0.035 },
  { title: "STIK Door / Brick Lane", id: "3adabd81-8ef0-4257-92cb-a2929ef8aa8a", scale: 0.68, y: 0.16, tilt: -0.025 }
];

let loaded = 0;
const radius = 4.25;

function setProgress() {
  countLabel.textContent = loaded + " / " + captures.length + " splats loaded";
  fill.style.width = Math.round((loaded / captures.length) * 100) + "%";
  if (loaded === captures.length) {
    setTimeout(() => loading.classList.add("hidden"), 450);
  }
}

function addCapture(item, index) {
  const angle = (index / captures.length) * Math.PI * 2;
  const holder = new THREE.Group();
  holder.position.set(Math.sin(angle) * radius, item.y, Math.cos(angle) * radius);
  holder.rotation.y = angle + Math.PI;
  holder.rotation.x = item.tilt;
  holder.rotation.z = (index % 2 ? 1 : -1) * 0.025;
  holder.scale.setScalar(item.scale);
  orbit.add(holder);

  const splat = new LumaSplatsThree({
    source: "https://lumalabs.ai/capture/" + item.id,
    loadingAnimationEnabled: false,
    particleRevealEnabled: false,
    enableThreeShaderIntegration: false
  });
  splat.onLoad = () => {
    loaded++;
    setProgress();
  };
  holder.add(splat);
  splat.onError = (err) => {
    console.error("Could not load splat:", item.title, err);
    errorBox.style.display = "block";
    errorBox.textContent = "A public test splat could not load. Try refreshing; the scene may be temporarily unavailable.";
  };
}

captures.forEach(addCapture);

const clock = new THREE.Clock();
let raf = 0;
function animate() {
  raf = requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.04);
  orbit.rotation.y += delta * 0.035;
  controls.update();
  renderer.render(scene, camera);
}
animate();

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize, { passive: true });

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
  } else {
    clock.getDelta();
    animate();
  }
});
</script>
</body>
</html>
