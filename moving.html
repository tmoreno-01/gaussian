import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

let worker=null, generation=0, info=null, cache=new Map(), pending=new Set(), playing=true, orbit=true, current=0, anchor=0, elapsed=0,last=0,lastStats=0, shown=-1, buffered=false,initial=null;const AHEAD=10, KEEP=14;
function resetView(){if(!initial)return;controls.target.set(...initial.center);camera.position.set(initial.center[0]+initial.span*.19,initial.center[1]+initial.span*.17,initial.center[2]+initial.span*1.3);controls.update();}
$('reset').onclick=resetView;$('orbit').onclick=()=>{orbit=!orbit;$('orbit').textContent=orbit?'Orbit on':'Orbit off';};$('play').onclick=()=>{playing=!playing;last=0;$('play').textContent=playing?'Pause':'Play';};$('size').oninput=()=>{if(material)material.uniforms.sizeScale.value=Number($('size').value);};$('scrub').oninput=()=>{if(!info)return;current=Number($('scrub').value);elapsed=current/info.fps;last=0;buffered=false;requestWindow();};
function requestWindow(){if(!info||!worker)return;for(let i=0;i<AHEAD;i++){const n=(current+i)%info.count;if(!cache.has(n)&&!pending.has(n)){pending.add(n);worker.postMessage({type:'frame',index:n});}}for(const k of cache.keys()){const d=(k-current+info.count)%info.count;if(d>=KEEP&&d<info.count-2)cache.delete(k);}}

const workerSource=`importScripts('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');let zip,meta,names,queue=[],busy=false;async function pump(){if(busy)return;busy=true;while(queue.length){let i=queue.shift();try{let b=await zip.file(names[i]).async('arraybuffer'),u=new Uint8Array(b),h=new TextDecoder().decode(u.subarray(0,2048)),e=h.indexOf('end_header');if(e<0||!h.includes('binary_little_endian'))throw Error('Expected binary little-endian PLY');let start=e+10;if(u[start]===13)start++;if(u[start]===10)start++;let n=Number(h.match(/element vertex (\\d+)/)[1]);if(!h.includes('property float x\\nproperty float y\\nproperty float z\\nproperty uchar red\\nproperty uchar green\\nproperty uchar blue'))throw Error('Unexpected vertex schema');if(start+n*15!==b.byteLength)throw Error('Unexpected PLY length');let dv=new DataView(b),pos=new Float32Array(n*3),rgb=new Uint8Array(n*3),rad=new Float32Array(n),min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(let j=0;j<n;j++){let k=start+j*15,p=j*3;pos[p]=dv.getFloat32(k,true);pos[p+1]=-dv.getFloat32(k+4,true);pos[p+2]=-dv.getFloat32(k+8,true);for(let a=0;a<3;a++){let x=pos[p+a];if(!Number.isFinite(x))throw Error('Non-finite point');min[a]=Math.min(min[a],x);max[a]=Math.max(max[a],x);rgb[p+a]=dv.getUint8(k+12+a);}}let span=Math.max(...max.map((v,a)=>v-min[a])),center=max.map((v,a)=>(v+min[a])/2);let width=n%512===0?512:Math.round(Math.sqrt(n));for(let j=0;j<n;j++){let p=j*3,ds=[];for(let t of [j-1,j+1,j-width,j+width]){if(t<0||t>=n)continue;if(Math.abs(t-j)===1&&Math.floor(j/width)!==Math.floor(t/width))continue;let q=t*3;ds.push(Math.hypot(pos[p]-pos[q],pos[p+1]-pos[q+1],pos[p+2]-pos[q+2]));}ds.sort((a,b)=>a-b);rad[j]=Math.max(span*.0007,Math.min(span*.012,(ds[Math.min(1,ds.length-1)]||span*.002)*1.6));}postMessage({type:'frame',index:i,n,pos,rgb,rad,bounds:{span,center}},[pos.buffer,rgb.buffer,rad.buffer]);}catch(e){postMessage({type:'error',message:String(e),index:i});}}busy=false;}onmessage=async e=>{try{if(e.data.type==='open'){zip=await JSZip.loadAsync(e.data.file);let m=Object.keys(zip.files).find(n=>n.endsWith('sequence.json'));meta=m?JSON.parse(await zip.file(m).async('string')):{};names=Object.keys(zip.files).filter(n=>/\\.ply$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!names.length)throw Error('No PLY frames');postMessage({type:'info',count:names.length,fps:Number(meta.fps)||30,source:meta.source||'Local sequence'});}else if(e.data.type==='frame'){queue.push(e.data.index);pump();}}catch(e){postMessage({type:'error',message:String(e)});}};`;
function open(file){if(!file)return;generation++;if(worker)worker.terminate();if(cloud){root.remove(cloud);geom.dispose();material.dispose();cloud=null;}root.rotation.y=0;info=null;cache.clear();pending.clear();current=0;shown=-1;elapsed=0;last=0;buffered=false;playing=true;$('play').disabled=true;$('play').textContent='Pause';drop.hidden=false;$('error').textContent='Opening ZIP…';const token=generation;const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);worker.onerror=e=>{$('error').textContent='Worker failed: '+e.message;drop.hidden=false;};worker.onmessage=e=>{if(token!==generation)return;const d=e.data;if(d.type==='info'){info=d;$('scrub').max=d.count-1;requestWindow();}else if(d.type==='frame'){pending.delete(d.index);cache.set(d.index,d);if(!cloud&&d.index===0){try{setFrame(d);drop.hidden=true;$('play').disabled=false;}catch(e){$('error').textContent=String(e);}}}else{pending.delete(d.index);$('error').textContent=d.message;drop.hidden=false;playing=false;}};worker.postMessage({type:'open',file});}
$('file').onchange=e=>open(e.target.files[0]);for(const t of ['dragover','drop'])window.addEventListener(t,e=>{e.preventDefault();if(t==='dragover')drop.classList.add('drag');else{drop.classList.remove('drag');open(e.dataTransfer.files[0]);}});window.addEventListener('dragleave',()=>drop.classList.remove('drag'));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(material)material.uniforms.pixelScale.value=renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));});document.addEventListener('visibilitychange',()=>{last=0;});let dragging=false;controls.addEventListener('start',()=>dragging=true);controls.addEventListener('end',()=>dragging=false);
function animate(now){requestAnimationFrame(animate);if(document.hidden)return;const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(info&&cloud){if(playing){if(!buffered)buffered=Array.from({length:Math.min(5,info.count)},(_,i)=>cache.has((current+i)%info.count)).every(Boolean);if(buffered){let next=(elapsed+dt)%(info.count/info.fps),idx=Math.floor(next*info.fps)%info.count;if(cache.has(idx)){elapsed=next;current=idx;}else buffered=false;}}if(cache.has(current)&&shown!==current)setFrame(cache.get(current));requestWindow();$('scrub').value=current;if(orbit&&!dragging)root.rotation.y+=dt*.065;if(now-lastStats>300){status.textContent=(current+1)+' / '+info.count+' · '+info.fps.toFixed(2)+' fps source · '+(cloud.geometry.attributes.radius.count).toLocaleString()+' points'+(playing&&!buffered?' · buffering':'');lastStats=now;}}controls.update();renderer.render(scene,camera);}requestAnimationFrame(animate);
